nodes: 5
rounds: 6
epochs: 1
seed: 666
protocol: memory
framework: pytorch
aggregator: fedavg
topology: full
batch_size: 128
show_metrics: false
measure_time: false
save_csv: true
output_dir: results/mnist-ca-runtime/clean
eligible_trainers: [node-0, node-1, node-2]
dataset: {name: p2pfl/MNIST, distribution: iid, reduced: true, partition_multiplier: 50}
validation:
  enabled: true
  contributors: [node-0, node-1, node-2]
  validators: [node-0, node-3, node-4]
  quorum: 3
  acceptance_threshold: 2
  max_l2_norm: .inf
  reference_reject_candidates: [node-0]
blockchain: {enabled: true, backend: memory, fail_closed: true}
trust: {enabled: true, method: beta_reputation, prior_alpha: 1, prior_beta: 1, update_source: validator_reference_agreement, observation_only: false}
selection:
  strategy: ca_state
  dynamic_roles:
    validators:
      bootstrap_rounds: 1
      target_count: 3
      eligible_participants: [node-0, node-1, node-2, node-3, node-4]
      minimum_trust: 0.5
      insufficient_eligible_policy: fail_closed
      tie_breaker: node_id
ca:
  enabled: true
  bootstrap_rounds: 1
  suspicious_contributors: true
  minimum_contributors: 1
  minimum_validators: 1
  validator_quorum: 1
  policy: {promotion_positive_rounds: 3, recovery_positive_rounds: 3, exclusion_negative_rounds: 2, severe_suspicious_probation_rounds: 1, excluded_cooldown_rounds: 3, trusted_neighbor_min_count: 0, trusted_neighbor_min_fraction: 0.0, promotion_min_trust: 0.7, recovery_min_trust: 0.6, recovery_enabled: false}
attack: {name: none, adversaries: [], parameters: {}}
