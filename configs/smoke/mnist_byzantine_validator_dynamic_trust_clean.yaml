nodes: 5
rounds: 2
epochs: 1
seed: 666
protocol: memory
framework: pytorch
aggregator: fedavg
topology: full
batch_size: 128
show_metrics: false
measure_time: false
save_csv: true
output_dir: results/byzantine-validator-dynamic-trust/clean
eligible_trainers: [node-0, node-1, node-2]
dataset: {name: p2pfl/MNIST, distribution: iid, reduced: true, partition_multiplier: 50}
validation:
  enabled: true
  contributors: [node-0, node-1, node-2]
  validators: [node-0, node-3, node-4]
  quorum: 3
  acceptance_threshold: 2
  max_l2_norm: .inf
  reference_reject_candidates: [node-0]
blockchain:
  enabled: true
  backend: memory
  fail_closed: true
attack:
  name: none
  adversaries: []
  parameters:
    strategy: invert_reference_vote
    group_id: mnist-smoke-byzantine-validators

trust:
  enabled: true
  method: beta_reputation
  prior_alpha: 1
  prior_beta: 1
  update_source: validator_reference_agreement
  observation_only: false

selection:
  strategy: trust_ranked
  dynamic_roles:
    validators:
      enabled: true
      bootstrap_rounds: 1
      target_count: 3
      eligible_participants: [node-0, node-1, node-2, node-3, node-4]
      minimum_trust: 0.5
      insufficient_eligible_policy: fail_closed
      tie_breaker: node_id
